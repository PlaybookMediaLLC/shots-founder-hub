name: web_ci

# https://github.com/tauri-apps/tauri-action/blob/3013cac/examples/test-build-only.yml
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - packages/**
      - .github/workflows/web_ci.yaml
      - .github/actions/pnpm_install/**
      - .github/actions/doxxer_install/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - doxxer.web.toml
  pull_request:
    paths:
      - apps/web/**
      - packages/**
      - .github/workflows/web_ci.yaml
      - .github/actions/pnpm_install/**
      - .github/actions/doxxer_install/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - doxxer.web.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/pnpm_install
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
      - run: pnpm -F ui build
      - run: pnpm -F @anlg/cloud-client typecheck
      - run: pnpm -F @anlg/cloud-client test
      - run: pnpm -F web typecheck
      - run: pnpm -F web test
      # Fails when a new article has no content/articles/figures.json entry.
      # A declared-but-ungenerated figure only warns; use --strict to gate on it.
      # Public HEAD requests only, so no Napkin or database credentials needed.
      - env:
          STATIC_MEDIA_REMOTE_CHECK: skip
        run: pnpm -F web media:figures:check
