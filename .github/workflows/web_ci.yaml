# CI-only activation: non-allowlisted jobs remain disabled, including reusable calls.
name: web_ci

# https://github.com/tauri-apps/tauri-action/blob/3013cac/examples/test-build-only.yml
on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm_install
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
      - run: pnpm -F ui build
      - run: pnpm -F @anlg/supabase typecheck
      - run: pnpm -F @anlg/supabase test
      - run: pnpm -F web typecheck
      - run: pnpm -F web test
      # Fails when a new article has no content/articles/figures.json entry.
      # A declared-but-ungenerated figure only warns; use --strict to gate on it.
      # Public HEAD requests only, so no Napkin or Supabase credentials needed.
      - run: pnpm -F web media:figures:check
    if: ${{ github.repository == 'PlaybookMediaLLC/shots-founder-hub' && github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 30

  deploy:
    needs: ci
    if: false
    permissions: {}
    uses: $/.github/workflows/web_cd.yaml
    with:
      sha: ${{ github.sha }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
      INFISICAL_SENTRY_TOKEN: ${{ secrets.INFISICAL_SENTRY_TOKEN }}
