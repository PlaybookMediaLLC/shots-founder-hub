# CI-only activation: non-allowlisted jobs remain disabled, including reusable calls.
name: opencode

on:
  workflow_call: null

jobs:
  opencode:
    # This job can mint an OIDC token, so never start it for outside commenters.
    if: false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        with:
          model: zai-coding-plan/glm-4.7
permissions: {}
