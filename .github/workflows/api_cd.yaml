# Builds the API image and deploys it to DigitalOcean App Platform. One app
# runs the ai, sync, and core roles behind a public gateway; a PRE_DEPLOY job
# applies database migrations first. Secrets come from Infisical
# (Desktop App Backend, prod, /founder-hub) through GitHub OIDC.
# A deploy starts only after api_ci passes on main, for the commit it tested.
on:
  workflow_run:
    workflows: [.github/workflows/api_ci.yaml]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/playbookmediallc/shots-founder-hub-api
  APP_NAME: founder-hub-api
  HEALTH_URL: https://founder-hub-api.shots.playbookmedia.io/health
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
          build-args: |
            APP_VERSION=${{ env.DEPLOY_SHA }}
            GH_SHA=${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/infisical_install
      - name: Load secrets and render the app spec
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$INFISICAL_IDENTITY_ID" && test -n "$INFISICAL_PROJECT_ID"
          jwt=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')
          token=$(infisical login --method=oidc-auth --machine-identity-id="$INFISICAL_IDENTITY_ID" \
            --jwt="$jwt" --silent --plain)
          echo "::add-mask::$token"
          secrets="$RUNNER_TEMP/secrets.json"
          infisical export --token="$token" --projectId="$INFISICAL_PROJECT_ID" --env=prod \
            --path=/founder-hub --format=json --output-file="$secrets"
          do_token=$(infisical secrets get DIGITALOCEAN_ACCESS_TOKEN --token="$token" \
            --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/founder-hub/deploy --plain --silent)
          echo "::add-mask::$do_token"
          echo "DIGITALOCEAN_ACCESS_TOKEN=$do_token" >> "$GITHUB_ENV"
          cd .github/scripts
          python3 render_api_app_spec.py --secrets "$secrets" --tag "$DEPLOY_SHA" \
            --output "$RUNNER_TEMP/spec.json"
          rm -f "$secrets"
      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ env.DIGITALOCEAN_ACCESS_TOKEN }}
          version: 1.180.0
      - name: Deploy
        run: |
          set -euo pipefail
          spec="$RUNNER_TEMP/spec.json"
          trap 'rm -f "$spec"' EXIT
          app_id=$(doctl apps list -o json | jq -r --arg name "$APP_NAME" '.[] | select(.spec.name == $name) | .id')
          if test -z "$app_id"; then
            doctl apps create --spec "$spec" --wait -o json > /dev/null
            app_id=$(doctl apps list -o json | jq -r --arg name "$APP_NAME" '.[] | select(.spec.name == $name) | .id')
          else
            doctl apps update "$app_id" --spec "$spec" --wait -o json > /dev/null
          fi
          app=$(doctl apps get "$app_id" -o json)
          test "$(jq -r '.[0].active_deployment.phase // empty' <<< "$app")" = ACTIVE
          for service in gateway ai sync core; do
            test "$(jq -r --arg s "$service" '.[0].active_deployment.spec.services[] | select(.name == $s) | .image.tag' <<< "$app")" = "$DEPLOY_SHA"
          done
          ingress=$(jq -r '.[0].default_ingress' <<< "$app")
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$ingress/health" > /dev/null
          # The gateway answers /health itself; these routes prove it reaches each
          # role. Core has no public routes until Nango is configured.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST "$ingress/llm/chat/completions")" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$ingress/v1/cloud-api/settings")" = 401
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$HEALTH_URL" > /dev/null \
            || echo "::warning::$HEALTH_URL is not reachable yet; check the DNS record"
          echo "API active: https://cloud.digitalocean.com/apps/$app_id" >> "$GITHUB_STEP_SUMMARY"
