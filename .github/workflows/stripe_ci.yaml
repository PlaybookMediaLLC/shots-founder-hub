# CI-only activation: non-allowlisted jobs remain disabled, including reusable calls.
on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: $/.github/actions/pnpm_install
      - uses: $/.github/actions/bun_install
      - run: python3 .github/scripts/test_deploy_api_drain.py
      - run: pnpm -F @anlg/stripe typecheck
      - run: pnpm -F @anlg/stripe test
    if: ${{ github.repository == 'PlaybookMediaLLC/shots-founder-hub' && github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 30
