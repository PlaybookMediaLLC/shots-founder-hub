# CI-only activation: non-allowlisted jobs remain disabled, including reusable calls.
name: fmt

on:
  pull_request:
    branches:
      - develop
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" > changed-files.nul
            echo "scoped=true" >> "$GITHUB_OUTPUT"
            if grep -zq '\.rs$' changed-files.nul; then echo "rust=true" >> "$GITHUB_OUTPUT"; fi
          else
            echo "scoped=false" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi
      - id: toolchain
        if: steps.changed.outputs.rust == 'true'
        shell: bash
        run: |
          echo "channel=$(grep 'channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "components=$(grep 'components' rust-toolchain.toml | sed 's/.*\[//' | sed 's/\].*//' | tr -d '"' | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: ${{ steps.toolchain.outputs.components }}
      - env:
          SCOPED: ${{ steps.changed.outputs.scoped }}
        run: |
          set -euo pipefail
          if [ "$SCOPED" = "true" ]; then
            xargs -0 --no-run-if-empty pnpm exec dprint check --allow-no-files < changed-files.nul
          else
            pnpm fmt:check
          fi
    if: ${{ github.repository == 'PlaybookMediaLLC/shots-founder-hub' && github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 30
permissions:
  contents: read
