name: PR Video Evidence

on:
  pull_request:
    types:
      [
        opened,
        edited,
        reopened,
        synchronize,
        ready_for_review,
      ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-video-evidence:
    name: pr-video-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: scripts/verify-pr-video-evidence.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPOSITORY: ${{ github.repository }}
        run: >-
          gh api --paginate
          "repos/${PR_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100"
          --jq '.[] | select(.status != "removed") | .filename'
          > "${RUNNER_TEMP}/changed-files.txt"
      - env:
          PR_REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/verify-pr-video-evidence.mjs
          --github-event-path "${GITHUB_EVENT_PATH}"
          --repository "${PR_REPOSITORY}"
          --changed-files-file "${RUNNER_TEMP}/changed-files.txt"
