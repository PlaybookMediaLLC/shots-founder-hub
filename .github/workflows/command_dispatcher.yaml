# CI-only activation: non-allowlisted jobs remain disabled, including reusable calls.
on:
  workflow_call: null

permissions: {}

jobs:
  check-permission:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: permission
        uses: ./.github/actions/check-permission
        with:
          user: ${{ github.event.comment.user.login }}
          allowed-users: ComputelessComputer|elstua
    if: false
    permissions: {}

  parse-stable-options:
    needs: check-permission
    if: false
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          if [[ ! "$COMMENT" =~ /stable[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)($|[[:space:]]) ]]; then
            echo "::error::Use /stable <version>, for example /stable 1.4.0"
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
    permissions: {}

  handle-stable:
    needs: [ check-permission, parse-stable-options ]
    if: false
    uses: ./.github/workflows/handle_release.yaml
    with:
      channel: stable
      version: ${{ needs.parse-stable-options.outputs.version }}
      issue_number: ${{ github.event.issue.number }}
      comment_id: ${{ github.event.comment.id }}
    secrets: inherit
    permissions: {}

  parse-staging-ref:
    needs: check-permission
    if: false
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.parse.outputs.ref }}
    steps:
      - id: parse
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          if [[ "$COMMENT" =~ /staging[[:space:]]+([a-zA-Z0-9_.][a-zA-Z0-9_./-]*)($|[[:space:]]) ]]; then
            echo "ref=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          fi
    permissions: {}

  handle-staging:
    needs: [ check-permission, parse-staging-ref ]
    if: false
    uses: ./.github/workflows/handle_staging.yaml
    with:
      ref: ${{ needs.parse-staging-ref.outputs.ref }}
      issue_number: ${{ github.event.issue.number }}
      comment_id: ${{ github.event.comment.id }}
    secrets: inherit
    permissions: {}

  handle-update:
    needs: check-permission
    if: false
    uses: ./.github/workflows/handle_update.yaml
    with:
      issue_number: ${{ github.event.issue.number }}
      comment_id: ${{ github.event.comment.id }}
    secrets: inherit
    permissions: {}

  parse-changelog-channel:
    needs: check-permission
    if: false
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.parse.outputs.channel }}
    steps:
      - id: parse
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          if [[ "$COMMENT" =~ /changelog[[:space:]]+(stable)($|[[:space:]]) ]]; then
            echo "channel=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "channel=stable" >> $GITHUB_OUTPUT
          fi
    permissions: {}

  handle-changelog:
    needs: [ check-permission, parse-changelog-channel ]
    if: false
    uses: ./.github/workflows/changelog.yaml
    with:
      channel: ${{ needs.parse-changelog-channel.outputs.channel }}
      issue_number: ${{ github.event.issue.number }}
      comment_id: ${{ github.event.comment.id }}
    secrets: inherit
    permissions: {}
